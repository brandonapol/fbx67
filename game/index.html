<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Second Rush: Prologue</title>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="place"></div>
