name: text-game explore

on:
  merge_group:
  pull_request:
    paths:
      - text-game/src/**
      - text-game/package.json
      - text-game/package-lock.json
      - text-game/.nvmrc
      - text-game/explore-budget.json
      - .github/workflows/text-game-explore.yml
  push:
    branches: [main]
    paths:
      - text-game/src/**
      - text-game/package.json
      - text-game/package-lock.json
      - text-game/.nvmrc
      - text-game/explore-budget.json
      - .github/workflows/text-game-explore.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: text-game

jobs:
  explore:
    runs-on: ${{ vars.TEXT_GAME_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: text-game/.nvmrc
          cache: npm
          cache-dependency-path: text-game/package-lock.json

      - name: Install
        run: npm ci

      - name: Exhaustive sweep
        run: |
          mkdir -p reports
          npm run -s explore -- --budget-table reports/budget.md > reports/explore.json

      - name: Summary
        if: always()
        run: |
          [ -s reports/explore.json ] || exit 0
          {
            echo '### Exhaustive sweep'
            if [ -s reports/budget.md ]; then
              echo '#### Against the budget (explore-budget.json)'
              cat reports/budget.md
              echo
            fi
            echo '```json'
            cat reports/explore.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
