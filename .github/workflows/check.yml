name: check

on:
  pull_request:
  # The merge queue runs every job on the pull request combined with main and whatever is queued ahead of it.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

# Cancels only superseded runs of the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      text: ${{ steps.filter.outputs.text }}
      web: ${{ steps.filter.outputs.web }}
      game: ${{ steps.filter.outputs.game }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/path-filters.yml
          base: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          ref: ${{ github.event.merge_group.head_sha || github.sha }}

  check-attribution:
    # Merge queue and manual runs have no pull request to read, so this runs on pull requests only.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level permissions replace the workflow's; pull-requests: read lets gh read the pull request.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for AI attribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: make check/attribution PR=${{ github.event.pull_request.number }}

  check-text:
    needs: changes
    if: needs.changes.outputs.text == 'true' || (github.event_name != 'pull_request' && github.event_name != 'merge_group')
    runs-on: ${{ vars.TEXT_GAME_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: text-game/.nvmrc
          cache: npm
          cache-dependency-path: text-game/package-lock.json
      - name: Install
        run: make setup/text
      - name: Typecheck
        run: make check/text/typecheck
      - name: Unit tests and golden route replay
        run: make test/text/unit
      - name: Verify liveness pruning
        run: make test/text/verify VERIFY_TRIALS=2000 VERIFY_SEED="$(( GITHUB_RUN_NUMBER * 2000 ))"
      - name: Matrix summary matches routes/matrix-summary.json
        run: make test/text/matrix
      - name: Generated routes are committed
        run: make check/routes

  check-web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || (github.event_name != 'pull_request' && github.event_name != 'merge_group')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: text-game/.nvmrc
          cache: npm
          cache-dependency-path: |
            text-game/package-lock.json
            web/package-lock.json
      - name: Install
        run: |
          make setup/text
          make setup/web
      - name: Build
        run: make build/web

  check-game:
    needs: changes
    if: needs.changes.outputs.game == 'true' || (github.event_name != 'pull_request' && github.event_name != 'merge_group')
    runs-on: ubuntu-latest
    # The smoke test walks the prologue's two legs downtown in real time under software rendering.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: text-game/.nvmrc
          cache: npm
          cache-dependency-path: |
            text-game/package-lock.json
            game/package-lock.json
      - name: Install
        run: |
          make setup/text
          make setup/game
      - name: Typecheck, parity tests and build
        run: make check/game
      - name: Install Chromium
        working-directory: game
        run: npx playwright install --with-deps chromium
      # Compares each capture with game/smoke/baselines and checks the budgets in docs/perf.md; both land in the job
      # summary. The report artifact holds every frame (frames/) and, for a changed one, before, after and diff (diff/).
      - name: Play the prologue in headless Chromium
        env:
          SMOKE_SHOTS: ${{ github.workspace }}/game/smoke-shots
          SMOKE_REPORT: ${{ github.workspace }}/game/smoke-report
          SMOKE_ARTIFACT: prologue-frames-${{ github.run_number }}-${{ github.run_attempt }}
        run: make test/game/smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: prologue-smoke-${{ github.run_number }}-${{ github.run_attempt }}
          path: game/smoke-shots/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: prologue-frames-${{ github.run_number }}-${{ github.run_attempt }}
          path: game/smoke-report/
          retention-days: 14
          if-no-files-found: ignore
