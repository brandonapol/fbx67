name: text-game checks

on:
  pull_request:
    paths:
      - text-game/**
      - .github/workflows/text-game-checks.yml
  push:
    branches: [main]
    paths:
      - text-game/**
      - .github/workflows/text-game-checks.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: text-game-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: text-game

jobs:
  checks:
    runs-on: ${{ vars.TEXT_GAME_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      VERIFY_TRIALS: 2000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: text-game/.nvmrc
          cache: npm
          cache-dependency-path: text-game/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests and golden route replay
        run: npm run test:unit

      - name: Verify liveness pruning
        run: node src/verify.ts --trials "$VERIFY_TRIALS" --seed "$(( GITHUB_RUN_NUMBER * VERIFY_TRIALS ))"

      - name: Matrix summary matches routes/matrix-summary.json
        run: npm run -s matrix:check
